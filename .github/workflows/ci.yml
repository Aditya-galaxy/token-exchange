name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Verify export output exists
        run: test -f out/index.html

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail only on high/critical so routine low-severity noise doesn't block PRs.
      # Runtime deps only: the site is a static export, so build tooling
      # (Tailwind, ESLint) never ships and can't be reached by a visitor.
      - run: npm audit --omit=dev --audit-level=high
      # Still surface dev-tooling advisories in the log without failing the job.
      - run: npm audit --audit-level=high || true
